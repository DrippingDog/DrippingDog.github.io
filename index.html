<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dripping Dog — Coming Soon</title>
  <meta name="description" content="Dripping Dog is coming soon. Sign up to be the first to know when we launch, and follow @thedrippingdog on Instagram and YouTube." />
  <meta name="theme-color" content="#0A0A02" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://drippingdog.in/" />

  <!-- Icons -->
  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <!-- Social / link previews (WhatsApp, Instagram, Facebook, LinkedIn, X) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Dripping Dog" />
  <meta property="og:title" content="Dripping Dog — Coming Soon" />
  <meta property="og:description" content="Something's dripping. Be the first to know when Dripping Dog launches." />
  <meta property="og:url" content="https://drippingdog.in/" />
  <meta property="og:image" content="https://drippingdog.in/assets/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Dripping Dog logo — yellow DD mark on black" />
  <meta property="og:locale" content="en_IN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Dripping Dog — Coming Soon" />
  <meta name="twitter:description" content="Something's dripping. Be the first to know when Dripping Dog launches." />
  <meta name="twitter:image" content="https://drippingdog.in/assets/og-image.jpg" />

  <!-- Tells Google the brand name, logo and official profiles -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://drippingdog.in/#org",
        "name": "Dripping Dog",
        "url": "https://drippingdog.in/",
        "logo": "https://drippingdog.in/assets/logo.png",
        "email": "drippingdog@gmail.com",
        "sameAs": [
          "https://www.instagram.com/thedrippingdog/",
          "https://www.youtube.com/@drippingdog"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://drippingdog.in/#website",
        "name": "Dripping Dog",
        "url": "https://drippingdog.in/",
        "publisher": { "@id": "https://drippingdog.in/#org" }
      }
    ]
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="assets/poster.jpg" />
  <style>
    :root {
      /* Sampled from the logo video */
      --ink: #0A0A02;      /* background black (slight olive tint) */
      --drip: #F6DE00;     /* logo yellow, as the browser renders the video */
      --drip-dim: #8A7C00; /* shadow layer yellow */
      --text: #F7F4D9;
      --gutter: clamp(16px, 4vw, 48px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--ink);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Background video ---------- */
    .bg {
      position: fixed; inset: 0;
      background: var(--ink) url("assets/poster.jpg") center / cover no-repeat;
    }
    .bg video {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 40%;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .bg video.ready { opacity: 1; }
    /* Bottom scrim so the copy reads over the yellow drips */
    .bg::after {
      content: ""; position: absolute; inset: auto 0 0 0; height: 46%;
      background: linear-gradient(to top, rgba(10,10,2,.92) 0%, rgba(10,10,2,.6) 45%, rgba(10,10,2,0) 100%);
      pointer-events: none;
    }

    /* Portrait screens: the wordmark spans the middle ~56% of the frame, so scale the
       video to ~150% width (sides crop, letters stay whole) and pin it near the top,
       fading its bottom edge into the page background. */
    @media (max-aspect-ratio: 1/1) {
      .bg { background: var(--ink); }
      .bg video {
        position: absolute; left: 50%; top: 26vh;
        width: 150vw; height: auto; max-width: none;
        transform: translateX(-50%);
        object-fit: cover;
        -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
                mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
      }
      .bg::after { height: 50%; }
    }

    /* ---------- Layout ---------- */
    .page {
      position: relative; z-index: 1;
      height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: calc(var(--gutter) + env(safe-area-inset-top)) var(--gutter) calc(var(--gutter) + env(safe-area-inset-bottom));
    }
    header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    }
    .eyebrow {
      font-size: 12px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase;
      color: var(--drip);
      display: inline-flex; align-items: center; gap: 10px;
    }
    .eyebrow .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--drip);
      box-shadow: 0 0 12px var(--drip);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .25; } }

    /* Sound toggle */
    .sound {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(10,10,2,.55); color: var(--drip);
      border: 1px solid rgba(246,222,0,.45); border-radius: 999px;
      padding: 10px 16px 10px 14px; cursor: pointer;
      font: 500 12px/1 "Space Grotesk", sans-serif; letter-spacing: .2em; text-transform: uppercase;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      transition: background .2s, color .2s;
    }
    .sound:hover, .sound:focus-visible { background: var(--drip); color: var(--ink); outline: none; }
    .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
    .bars i { width: 3px; height: 4px; background: currentColor; border-radius: 1px; transition: height .2s; }
    .sound[aria-pressed="true"] .bars i { animation: eq .9s ease-in-out infinite; }
    .sound[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: -.3s; }
    .sound[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: -.6s; }
    .sound[aria-pressed="true"] .bars i:nth-child(4) { animation-delay: -.15s; }
    @keyframes eq { 0%,100% { height: 4px; } 50% { height: 14px; } }
    .sound[hidden] { display: none; }

    /* Bottom block */
    .foot {
      display: grid; gap: 22px;
      grid-template-columns: 1fr auto; align-items: end;
    }
    h1 {
      font-family: "Anton", Impact, sans-serif; font-weight: 400;
      font-size: clamp(34px, 4.2vw, 76px); line-height: .9; letter-spacing: .01em;
      color: var(--drip);
      text-transform: uppercase;
    }
    /* Centered in the dark band above the wordmark. Hidden until the video's
       wordmark has formed, then it drips in from above. */
    .top { display: grid; gap: 10px; }
    h1 { text-align: center; opacity: 0; transform: scale(.2); }
    /* Grows slowly from small to full size while fading in — no overshoot */
    h1.show { animation: pop 2.4s cubic-bezier(.25,.6,.3,1) forwards; }
    @keyframes pop {
      0%   { opacity: 0; transform: scale(.2); filter: blur(8px); }
      100% { opacity: 1; transform: scale(1);  filter: blur(0); }
    }
    .tag { text-shadow: 0 1px 12px rgba(10,10,2,.9); max-width: 34ch; font-size: clamp(14px, 1.3vw, 17px); line-height: 1.5; color: rgba(247,244,217,.8); }

    form { display: flex; gap: 8px; width: min(420px, 100%); }
    input[type="email"] {
      flex: 1; min-width: 0;
      background: rgba(10,10,2,.7); color: var(--text);
      border: 1px solid rgba(246,222,0,.4); border-radius: 999px;
      padding: 14px 18px; font: 400 15px "Space Grotesk", sans-serif;
    }
    input[type="email"]::placeholder { color: rgba(247,244,217,.5); }
    input[type="email"]:focus { outline: none; border-color: var(--drip); box-shadow: 0 0 0 3px rgba(246,222,0,.2); }
    button.submit {
      background: var(--drip); color: var(--ink); border: 0; border-radius: 999px;
      padding: 14px 22px; cursor: pointer;
      font: 700 13px "Space Grotesk", sans-serif; letter-spacing: .14em; text-transform: uppercase;
      transition: transform .15s, box-shadow .15s;
    }
    button.submit:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(246,222,0,.4); }
    button.submit:disabled { opacity: .6; cursor: wait; transform: none; box-shadow: none; }
    .right { display: grid; gap: 14px; justify-items: end; }
    .note { font-size: 13px; line-height: 1.45; color: var(--drip); min-height: 1.2em; max-width: 420px; }
    .social { display: flex; gap: 18px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; }
    .social a { color: rgba(247,244,217,.75); text-decoration: none; border-bottom: 1px solid transparent; }
    .social a:hover { color: var(--drip); border-color: var(--drip); }

    h1 br { display: none; }   /* one line on wide screens, stays clear of the wordmark */
    h1 span + br + span { margin-left: .2em; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    @media (max-width: 760px) {
      h1 { font-size: clamp(44px, 13vw, 72px); margin-top: 9vh; }  /* breathing room under the eyebrow */
      h1 br { display: inline; }
      h1 span + br + span { margin-left: 0; }
      .foot { grid-template-columns: 1fr; }
      .right { justify-items: start; }
      .eyebrow { font-size: 11px; letter-spacing: .2em; }
      .sound .label { display: none; }
      .sound { padding: 10px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow .dot, .sound .bars i { animation: none !important; }
      h1 { transform: none; }
      h1.show { animation: fade .6s ease forwards; }
      @keyframes fade { to { opacity: 1; } }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <video id="bg" aria-label="Dripping Dog logo animation" muted playsinline autoplay preload="auto" poster="assets/poster.jpg"></video>
  </div>

  <!-- Soundtrack: drop the WAV in /assets with this name (or change the src) -->
  <audio id="track" src="assets/audio.wav" loop preload="auto"></audio>

  <main class="page">
    <div class="top">
    <header>
      <span class="eyebrow"><span class="dot"></span>Something's dripping</span>
      <button class="sound" id="soundBtn" type="button" aria-pressed="false" aria-label="Turn sound on">
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="label">Sound off</span>
      </button>
    </header>
    <h1 id="headline"><span class="sr-only">Dripping Dog — </span><span>Coming</span><br /><span>Soon</span></h1>
    </div>

    <section class="foot">
      <div>
        <p class="tag">We're cooking up something loud. Drop your email and be first to know when we land.</p>
      </div>
      <div class="right">
        <form id="notify" novalidate>
          <input type="email" name="email" placeholder="you@email.com" aria-label="Email address" autocomplete="email" required />
          <!-- spam trap: real people never see or fill this -->
          <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" />
          <button class="submit" type="submit">Notify me</button>
        </form>
        <p class="note" id="note" role="status"></p>
        <nav class="social" aria-label="Social">
          <a href="https://www.instagram.com/thedrippingdog/" target="_blank" rel="noopener">Instagram</a>
          <a href="https://www.youtube.com/@drippingdog" target="_blank" rel="noopener">YouTube</a>
          <a href="mailto:drippingdog@gmail.com">Contact</a>
        </nav>
      </div>
    </section>
  </main>

  <script>
    // ---------- Video ----------
    // Timeline: 0–3s wordmark builds & starts melting, 3–10s drips flow.
    // Play the intro once, then loop only the drip section so it never "rebuilds".
    const LOOP_FROM = 3.5;
    const video = document.getElementById('bg');
    const small = window.matchMedia('(max-width: 900px)').matches;
    video.src = small ? 'assets/bg-mobile.mp4' : 'assets/bg.mp4';
    // Fade the video in as soon as its first frame is ready — even if autoplay is
    // blocked (e.g. low-power mode), the frame/poster still shows instead of black.
    const showVideo = () => video.classList.add('ready');
    video.addEventListener('loadeddata', showVideo, { once: true });
    video.addEventListener('playing', showVideo, { once: true });
    // Reveal "Coming Soon" once the wordmark has formed in the video (~2.6s in),
    // with a timed fallback in case the video can't autoplay.
    const REVEAL_AT = 2.6;
    const headline = document.getElementById('headline');
    const reveal = () => headline.classList.add('show');
    video.addEventListener('timeupdate', function check() {
      if (video.currentTime >= REVEAL_AT) { reveal(); video.removeEventListener('timeupdate', check); }
    });
    // Safety nets: show it anyway if the video fails, or after 6s whatever happens
    // (autoplay blocked, low-power mode pausing the video, slow network).
    video.addEventListener('error', reveal);
    setTimeout(reveal, 6000);
    video.addEventListener('ended', () => { video.currentTime = LOOP_FROM; video.play().catch(() => {}); });
    video.play().catch(() => {}); // muted autoplay is allowed; ignore if blocked (poster stays)
    // Background tabs can pause media; resume when the visitor comes back.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { video.play().catch(() => {}); if (btn.getAttribute('aria-pressed') === 'true') track.play().catch(() => {}); }
    });

    // ---------- Audio ----------
    // Browsers block audible autoplay, so sound starts on the first tap/click or via the toggle.
    const track = document.getElementById('track');
    const btn = document.getElementById('soundBtn');
    const label = btn.querySelector('.label');
    track.volume = 0;

    function fadeTo(target, ms = 800) {
      const start = track.volume, t0 = performance.now();
      return new Promise(res => {
        (function step(now) {
          const k = Math.min(1, (now - t0) / ms);
          track.volume = start + (target - start) * k;
          k < 1 ? requestAnimationFrame(step) : res();
        })(t0);
      });
    }
    function setUI(on) {
      btn.setAttribute('aria-pressed', on);
      btn.setAttribute('aria-label', on ? 'Turn sound off' : 'Turn sound on');
      label.textContent = on ? 'Sound on' : 'Sound off';
    }
    async function soundOn() {
      try { await track.play(); setUI(true); fadeTo(0.8); } catch (e) { setUI(false); }
    }
    async function soundOff() {
      setUI(false); await fadeTo(0, 400); track.pause();
    }
    btn.addEventListener('click', e => {
      e.stopPropagation();
      track.paused ? soundOn() : soundOff();
    });
    // If the audio file is missing, hide the toggle instead of showing a dead button.
    // The 404 can fire before this script runs, so check the current state too.
    btn.hidden = true;
    const audioOk = () => { btn.hidden = false; };
    if (track.error) btn.hidden = true;
    else if (track.readyState >= 1) audioOk();
    else track.addEventListener('loadedmetadata', audioOk, { once: true });
    track.addEventListener('error', () => { btn.hidden = true; });

    // ---------- Email form ----------
    // Static site, so no server of our own: FormSubmit (formsubmit.co) emails each
    // signup to the inbox below. One-time setup: the first submission makes FormSubmit
    // send an "Activate Form" email to that inbox — click it, and signups flow from then on.
    const INBOX = 'drippingdog@gmail.com';
    const form = document.getElementById('notify');
    const note = document.getElementById('note');
    const submitBtn = form.querySelector('.submit');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (form._honey.value) return;                 // bot
      const email = form.email.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        note.textContent = 'That email looks a bit wet. Try again?';
        return;
      }
      if (location.protocol === 'file:') {
        note.textContent = 'Signups only work when the site is opened from a web address, not as a file.';
        return;
      }
      submitBtn.disabled = true;
      note.textContent = 'Dripping…';
      try {
        const res = await fetch('https://formsubmit.co/ajax/' + INBOX, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            email,
            _subject: 'New Dripping Dog signup',
            _template: 'table',
            _captcha: 'false'
          })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && String(data.success) === 'true') {
          note.textContent = "You're on the list. Stay thirsty.";
          form.reset();
        } else {
          // Show FormSubmit's own reason (e.g. the form still needs activating).
          console.warn('FormSubmit:', res.status, data);
          note.textContent = data.message || 'Something went wrong. Please try again in a moment.';
        }
      } catch (err) {
        console.warn('FormSubmit unreachable:', err);
        note.textContent = 'Network hiccup. Please try again in a moment.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
